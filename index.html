<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
:root{color-scheme:light;--bf:Figtree,"Segoe UI",system-ui,sans-serif;--rc:14px;--rs:10px;--rbtn:10px;--cs:0 1px 2px rgba(60,40,20,.05);--cbc:var(--line);--bsh:inset 0 1px 0 rgba(255,236,200,.18),0 1px 2px rgba(30,20,10,.2);--hf:"Cormorant Garamond",Georgia,serif;--hz:1;--hw:600;--off:#ebe4d8;--card:#f8f4ec;--sand:#ddd3c3;--taupe:#86745f;--brown:#3b2a20;--ink:#231a14;--mute:#6a5d50;--line:#d5c9b6;--olive:#56653a;--bad:#9b3b2b;--warn:#8a5d0e;--gold:#a57b36;--gold2:#cfa458;--halo:rgba(255,248,235,.95);--lg:0 0 9px rgba(165,123,54,.5);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--off:#15100c;--card:#1f1712;--sand:#2b2119;--taupe:#a39380;--brown:#e6d1b0;--ink:#f2e8d9;--mute:#b0a291;--line:#3a2d23;--olive:#adb572;--bad:#e88c78;--warn:#e6b65c;--gold:#e2b366;--gold2:#f3d08c;--halo:rgba(226,179,102,.12);--lg:0 0 12px rgba(226,179,102,.75);}}

*{box-sizing:border-box}
body{margin:0;background:radial-gradient(130% 380px at 50% -60px,var(--halo),transparent 72%) fixed no-repeat,var(--off);color:var(--ink);font:16px/1.5 var(--bf);max-width:560px;margin-inline:auto;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--hf);font-weight:var(--hw);letter-spacing:.008em;margin:0}

img:not([src]){visibility:hidden}
.hero{position:relative;margin:0 -16px;aspect-ratio:4/3;overflow:hidden;background:var(--sand)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}

#nv button{position:relative}#nv button[aria-current="page"]{color:var(--brown);font-weight:700}#nv button[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:50%;width:34px;margin-left:-17px;height:3px;border-radius:0 0 3px 3px;background:var(--gold2);box-shadow:var(--lg)}

.hero{aspect-ratio:16/10}.hero h1{font-size:44px;line-height:1.02;overflow-wrap:anywhere;text-shadow:0 1px 12px rgba(0,0,0,.35)}.hero.none h1{text-shadow:none}.hero p.mt{font-size:12px;opacity:.78;margin-top:8px}

.seg.w{flex-wrap:wrap}.seg.w button{flex:1 1 45%}
.obq{font:var(--hw) calc(32px*var(--hz))/1.1 var(--hf);color:var(--brown);margin:30px 0 8px}

.covprev{border-radius:var(--rs);overflow:hidden;margin:8px 0}.covprev img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}

.covbtn{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(30,26,22,.55);color:#f7f3ec;border:1px solid rgba(247,243,236,.35);border-radius:var(--rc);padding:8px 14px;min-height:40px;font:600 13px var(--bf);cursor:pointer;backdrop-filter:blur(6px);z-index:2}

.pg{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;margin:18px 0 4px;font-size:13px;color:var(--mute)}

.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--off)}.btn.bad:disabled{opacity:.45;cursor:not-allowed}

.gbtn{background:var(--brown)}.spin{width:28px;height:28px;border:3px solid var(--sand);border-top-color:var(--olive);border-radius:50%;animation:sp 1s linear infinite;margin:18px 0}@keyframes sp{to{transform:rotate(360deg)}}

.fin2{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:16px 16px 6px;margin:8px 0;box-shadow:0 1px 2px rgba(60,40,20,.05)}

const parse=s=>{s=String(s==null?'':s).replace(/[R$\s]/g,'');if(!s)return null;
 if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 const n=parseFloat(s);return isFinite(n)&&n>=0?Math.round(n*100):null};

function parseBR(s){s=String(s==null?'':s).trim();if(!s)return'';const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);if(!m)return null;const d=+m[1],mo=+m[2],y=+m[3];
 if(y<1900||y>2100||mo<1||mo>12||d<1||d>new Date(Date.UTC(y,mo,0)).getUTCDate())return null;return m[3]+'-'+m[2]+'-'+m[1]}
const maskBR=s=>{const x=String(s==null?'':s).replace(/\D/g,'').slice(0,8);return x.length>4?x.slice(0,2)+'/'+x.slice(2,4)+'/'+x.slice(4):x.length>2?x.slice(0,2)+'/'+x.slice(2):x};
const toBR=iso=>iso&&/^\d{4}-\d{2}-\d{2}$/.test(iso)?iso.split('-').reverse().join('/'):'';
const isISO=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&parseBR(toBR(s))===s;
function addMonths(iso,k){const [y,m,d]=iso.split('-').map(Number),t=m-1+k,Y=y+Math.floor(t/12),M=((t%12)+12)%12,last=new Date(Date.UTC(Y,M+1,0)).getUTCDate();
 return Y+'-'+String(M+1).padStart(2,'0')+'-'+String(Math.min(d,last)).padStart(2,'0')}

function dealStats(total,pays){const ps=pays.filter(p=>p.kind!=='refund'),sum=a=>a.reduce((s,p)=>s+p.amount,0),paid=sum(ps.filter(p=>p.paid)),sched=sum(ps.filter(p=>!p.paid)),g={};
 GRPS.forEach(([k])=>{const a=ps.filter(p=>(p.seg||'saldo')===k);g[k]={n:a.length,nPaid:a.filter(p=>p.paid).length,sum:sum(a),paid:sum(a.filter(p=>p.paid))}});
 const next=ps.filter(p=>!p.paid&&p.date).sort((a,b)=>a.date.localeCompare(b.date))[0]||null;
 return{total,paid,sched,rest:total-paid-sched,left:Math.max(0,total-paid),n:ps.length,nPaid:ps.filter(p=>p.paid).length,g,next}}

function pinMove(id,dir){const L=pinList(),x=L.findIndex(i=>i.id===id),y=x+dir;if(x<0||y<0||y>=L.length)return;const a=L[x],b=L[y],t=a.pin;a.pin=b.pin;b.pin=t}
function pinClear(){S.items.forEach(i=>{if(i.pin!=null)i.pin=null})}
function pend(){const today=todayStr(),open=act().filter(i=>i.status!=='done'),
 pins=pinList(),its=pins.length?pins:[...open.filter(i=>i.end).sort((a,b)=>a.end.localeCompare(b.end)),...open.filter(i=>!i.end)].slice(0,4),
 ps=S.pays.filter(p=>!p.paid&&p.kind!=='refund'&&p.date&&item(p.itemId)&&!item(p.itemId).deleted&&!item(p.itemId).returned).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3),late=d=>d&&d<today;
 const rows=its.map(i=>`<button class="mini" data-go="${i.id}"><span><b>${esc(i.name)}</b><small>${i.area==='obra'?'Obra':'Enxoval'} · ${i.end?'prazo '+fdate(i.end):'sem prazo'}</small></span><span class="${late(i.end)?'neg':''}">${late(i.end)?'Atrasado':stLabel(i)}</span></button>`)
 .concat(ps.map(p=>{const i=item(p.itemId);return `<button class="mini" data-go="${i.id}"><span><b>Parcela de ${R(p.amount)}</b><small>${esc(i.name)}${p.seg?' · '+esc((GRPS.find(x=>x[0]===p.seg)||[0,''])[1]):''} · vence ${fdate(p.date)}</small></span><span class="${late(p.date)?'neg':''}">${late(p.date)?'Vencida':'A pagar'}</span></button>`}));
 return rows}
function pickRow(i,pinned,pos,n){return `<div class="pkr"><label><input type="checkbox" data-pkid="${i.id}" ${pinned?'checked':''}><span><b>${esc(i.name)}</b><small>${i.area==='obra'?'Obra':'Enxoval'}</small></span></label>${pinned?`<span class="pkm"><button class="lk" data-pkm="${i.id}:-1" aria-label="Subir ${esc(i.name)}" ${pos===0?'disabled':''}>▲</button><button class="lk" data-pkm="${i.id}:1" aria-label="Descer ${esc(i.name)}" ${pos===n-1?'disabled':''}>▼</button></span>`:''}</div>`}
function pickPanel(){const open=act().filter(i=>i.status!=='done'),pins=pinList(),rest=open.filter(i=>!Number.isFinite(i.pin)).sort((a,b)=>(a.area===b.area?0:a.area==='obra'?-1:1)||a.name.localeCompare(b.name,'pt-BR'));
 return `<div class="pkp"><p class="note">Marque os itens que você quer ver aqui. Use as setas para mudar a ordem. ${pins.length?'Enquanto houver itens marcados, só eles aparecem (as parcelas a vencer continuam).':'Sem nenhum marcado, o app mostra sozinho os 4 mais próximos.'}</p>${pins.length?`<h4>Escolhidas (${pins.length})</h4>${pins.map((i,x)=>pickRow(i,true,x,pins.length)).join('')}`:''}${rest.length?`<h4>${pins.length?'Outros itens':'Itens em aberto'}</h4><div class="pkl">${rest.map(i=>pickRow(i,false)).join('')}</div>`:''}<div class="acts">${pins.length?'<button class="lk" data-pkclr>Voltar ao automático</button>':''}<button class="lk" data-pkdone>Concluir</button></div></div>`}
function pendBox(){const r=pend(),pk=U.pendPick,n=act().filter(i=>i.status!=='done').length;if(!r.length&&!(pk&&n))return !n?'':`<details class="addbox gonebox" data-pend ${U.pendOpen?'open':''}><summary>Próximas pendências</summary><p class="note">Nada pendente agora.</p></details>`;
 const pins=pinList().length;return `<details class="addbox gonebox" data-pend ${U.pendOpen||pk?'open':''}><summary>Próximas pendências (${r.length})</summary>${pk?pickPanel():r.join('')+`<div class="acts"><button class="lk" data-pkopen>${pins?'Mudar a escolha':'Escolher quais aparecem'}</button>${pins?'<span class="note">Escolhidas por você</span>':''}</div>`}</details>`}

function histHtml(id){const lg=S.log.filter(l=>l.itemId===id).slice().reverse();return lg.map(l=>`<div class="lg"><small>${dt(l.ts)}</small>${esc(l.txt)}</div>`).join('')}
function archive(){const g=S.items.filter(i=>i.deleted).sort((x,y)=>String(y.deleted).localeCompare(String(x.deleted)));if(!g.length)return '';
 const o=!!U.goneOpen;
 return `<details class="addbox gonebox" data-gone ${o?'open':''}><summary>Itens excluídos (${g.length})</summary><p class="note">Ficam guardados com pagamentos e histórico e não entram nos totais.</p>`+g.map(i=>{const c=ic(i),ps=pd(i.id);
 return `<div class="gr"><div class="gl2"><span class="gn2">${esc(i.name)}</span><small>${AREA_NM[i.area]||'Enxoval'} · ${dt(i.deleted)}${c.paid?' · pago '+R(c.paid):''}</small></div><button class="lk" data-arc="${i.id}" aria-expanded="${U.arc===i.id}">Histórico</button><button class="st" data-rs="${i.id}">Restaurar</button></div>`+(U.arc===i.id?`<div class="gh2"><div class="fin">Previsto ${R(i.planned)} · ${c.hasC?'Contratado '+R(i.contracted):'Não contratado'} · Pago ${R(c.paid)}</div>`+ps.map(p=>`<div class="pr"><span>${p.date?fdate(p.date):'sem data'}</span><b>${p.kind==='refund'?'−':''}${R(p.amount)}</b><span>${p.kind==='refund'?(p.paid?'Estornado':'Estorno pendente'):(p.paid?'Pago':'Agendado')}</span></div>`).join('')+histHtml(i.id)+'</div>':'')}).join('')+'</details>'}

function backupCard(){const imp=U.imp,o=imp&&imp.obj,d=o&&o.data;
 return `<div class="card"><p class="fin">Último backup: ${S.meta.lastExport?dt(S.meta.lastExport):'nunca'}.</p>
<div class="two"><button class="btn" data-exp="file">Baixar backup</button><button class="btn alt" data-exp="copy">Copiar texto</button></div><button class="lk" data-exp="copynp">Copiar texto sem fotos (bem menor)</button>
<h4>Restaurar</h4><input type="file" data-impf id="impf" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" tabindex="-1" aria-hidden="true"><button type="button" class="btn" data-pastebtn style="width:100%">Colar backup copiado</button><p class="note">No app do Claude o seletor de arquivos costuma não abrir. Use “Copiar texto” no aparelho de origem e depois “Colar backup copiado” aqui. Se o botão não funcionar, cole manualmente no campo abaixo.</p><button type="button" class="lk" data-pickfile>Tentar escolher um arquivo .json</button>
<details open><summary>Ou cole o texto do backup</summary><textarea id="pastebox" rows="4" aria-label="Texto do backup"></textarea><button class="btn alt" data-impt style="margin-top:8px;width:100%">Ler texto</button></details>
${imp?`<div class="warn ok"><b>Backup de ${dt(o.exportedAt)}</b><br>${d.items.filter(i=>!i.deleted).length} item(ns) ativos, ${d.items.filter(i=>i.deleted).length} excluído(s), ${d.pays.length} pagamento(s), ${d.rooms.length} ambiente(s), ${Object.keys(o.photos||{}).length} foto(s).</div>
<div class="two"><button class="btn" data-imp="merge">Mesclar</button><button class="btn alt" data-imp="replace">${U.arm==='imprep'?'Toque de novo: substituir':'Substituir tudo'}</button></div><p class="note">Mesclar só acrescenta o que ainda não existe aqui; itens com o mesmo id ou ambientes com o mesmo nome não são duplicados. Substituir troca todos os dados pelos do backup.</p><button class="lk" data-imp="cancel">Cancelar</button>`:''}
${hasPrev()?`<button class="lk" data-undo>Desfazer última restauração ou limpeza</button>`:''}
${U.bmsg?`<p class="warn ok" role="status">${esc(U.bmsg)}</p>`:''}</div>`}

const ROOF='<svg class="roof" viewBox="0 0 200 80" aria-hidden="true"><path d="M8 72V42l50-30 50 30v30M108 72V34l40-24 44 26v36M0 72h200" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
function settings(){const h=S.house,rp=S.rooms.flatMap(r=>r.img.map(k=>({k,r})));
 return `<details id="cfg" class="cfg" ${U.cfg?'open':''}><summary>Configurações da casa</summary><div class="cfgb">
<form class="hnf" data-hform="0"><label>Como você quer chamar a sua casa?<input name="hname" maxlength="60" value="${esc(h.name)}" placeholder="Ex.: Casa dos Sonhos" autocomplete="off" data-hname></label><p class="note">Dê um nome à sua casa. Você pode mudar quando quiser.</p><button class="btn alt">Salvar nome</button></form>
${lookPicker()}<h4>Foto de capa</h4>${h.cover?`<div class="covprev">${imgEl(h.cover,'Capa atual da casa')}</div>`:'<p class="note">Nenhuma foto escolhida: a página inicial usa uma capa neutra.</p>'}
<label>${h.cover?'Substituir foto de capa':'Escolher foto de capa'}<input type="file" accept="image/*" data-covup></label>
${rp.length?`<p class="cap">Ou use uma foto de ambiente</p><div class="strip">${rp.map(({k,r})=>`<button data-pickcov="${k}" aria-label="Usar foto de ${esc(r.name)} como capa">${imgEl(k,'')}</button>`).join('')}</div>`:''}
${h.cover?`<button class="lk" data-rmcov>${U.arm==='rmcov'?'Toque de novo para remover a capa':'Remover capa'}</button>`:''}
<p class="note">Nome, capa e fotos ficam salvos neste navegador, só para quem usa o app neste aparelho. Para levar tudo para outro aparelho, use o backup abaixo.</p></div></details>`}
function onboarding(){const h=S.house;
 if(U.ob===2||U.ob===3){const k=U.ob===2?'obra':'enxoval',q=k==='obra'?'Qual é o orçamento previsto para a obra/reforma?':'Qual é o orçamento previsto para o enxoval?',tb=k==='obra'?'Obra':'Enxoval';
  return `<section class="ob-s"><h1>${h.name?esc(h.name):'Bem-vindos ao lar'}</h1><form data-bform="${k}"><label class="obq" for="bud1">${q}</label><p class="note">É opcional. Você pode informar o valor agora, pular, e definir ou alterar depois na aba ${tb}, em “Orçamento ${k==='obra'?'da obra':'do enxoval'} (editar)”.</p><input id="bud1" name="budget" inputmode="decimal" autocomplete="off" placeholder="Valor em R$ (ex.: ${k==='obra'?'80.000,00':'15.000,00'})" ${U.obErr?'aria-describedby="budh"':''}>${U.obErr?`<p class="warn" role="alert" id="budh">${esc(U.obErr)}</p>`:''}<button class="btn" style="width:100%;margin-top:12px">Informar valor</button></form><button class="btn alt" data-obbskip="${k}" style="width:100%;margin-top:10px">Pular esta etapa</button></section>`}
 if(U.ob===4)return `<section class="ob-s"><h1>${h.name?esc(h.name):'Bem-vindos ao lar'}</h1><h2>Quer adicionar uma foto de capa?</h2><p class="note">É opcional. A foto aparece no topo da página inicial. Você pode pular e escolher depois em Configurações da casa.</p><label>Foto de capa<input type="file" accept="image/*" data-obcover></label><button class="btn alt" data-obskip2 style="width:100%;margin-top:12px">Pular e escolher depois</button></section>`;
 return `<section class="ob-s"><form data-hform="1"><label class="obq" for="hname1">Como você quer chamar a sua casa?</label><p class="note">Dê um nome à sua casa. Você pode mudar quando quiser.</p><input id="hname1" name="hname" maxlength="60" required autocomplete="off" placeholder="Ex.: Casa dos Sonhos" value="${esc(h.name)}"><button class="btn" style="width:100%;margin-top:12px">Continuar</button></form><button class="lk" data-obskip1 style="margin-top:8px">Pular por enquanto</button></section>`}
const CAM='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>';
function home(){const h=S.house,ob=act().filter(i=>i.area==='obra'),dn=ob.filter(i=>i.status==='done').length,
 pct=ob.length?Math.round((dn+ob.filter(i=>i.status==='doing').length/2)/ob.length*100):0,pe=prog(),sub=`${S.rooms.length} ambientes · ${act().length} itens cadastrados`,
 pick=`<label class="covbtn">${CAM}${h.cover?'Alterar capa':'Adicionar foto de capa'}<input type="file" accept="image/*" data-herocov aria-label="${h.cover?'Alterar foto de capa':'Adicionar foto de capa'}"></label>`,
 ttl=h.name?esc(h.name):'Sua casa',
 hero=h.cover?`<header class="hero">${imgEl(h.cover,'Foto de capa da casa')}${pick}<div><h1>${ttl}</h1><p class="mt">${sub}</p></div></header>`
  :`<header class="hero none">${ROOF}<div><h1>${ttl}</h1><p class="mt">${sub}</p>${pick}</div></header>`,
 inv=h.name?'':`<form class="hnf" data-hform="0" style="margin:12px 0 0"><label class="inv">Como você quer chamar a sua casa?<input name="hname" maxlength="60" placeholder="Ex.: Casa dos Sonhos" autocomplete="off"></label><p class="note">Dê um nome à sua casa. Você pode mudar quando quiser.</p><button class="btn alt" style="padding:8px 16px;min-height:40px">Salvar nome</button></form>`;
 return hero+inv+settings()+styleCard()+guideCard()+
`<div class="pg" role="group" aria-label="Andamento"><b>Obra</b><span>${ob.length?dn+' de '+ob.length+' itens concluídos · '+pct+'%':'Nenhum item de obra ainda'}</span><div class="bar full" style="grid-column:1/-1" role="progressbar" aria-label="Andamento da obra" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
<b>Enxoval</b><span>${pe.n?pe.d+' de '+pe.n+' itens comprados · '+pe.pct+'%':'Nenhum item de enxoval ainda'}</span><div class="bar full" style="grid-column:1/-1" role="progressbar" aria-label="Andamento do enxoval" aria-valuenow="${pe.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pe.pct}%"></i></div></div>
${S.budget.total!=null&&!S.meta.legacyAck?`<div class="card" style="margin-top:14px"><p class="fin" style="margin:0 0 8px">Você tinha um <b>orçamento total de ${R(S.budget.total)}</b> cadastrado. O app agora trabalha só com orçamentos separados de obra e enxoval, e esse valor antigo não entra mais nos cálculos. Ele foi mantido nos seus dados e no backup. Defina o orçamento de cada área nas abas Obra e Enxoval.</p><button class="btn alt" data-legack style="padding:8px 16px;min-height:40px">Entendi</button></div>`:''}
<h2>Finanças</h2>${warns()}
<h3>Obra</h3>${grid(tot('obra'),S.budget.obra,'Orçamento da obra')}<button class="lk" data-gobud="obra">${S.budget.obra==null?'Definir orçamento da obra':'Ver orçamento da obra'}</button>
<h3>Enxoval</h3>${grid(tot('enxoval'),S.budget.enxoval,'Orçamento do enxoval')}<button class="lk" data-gobud="enxoval">${S.budget.enxoval==null?'Definir orçamento do enxoval':'Ver orçamento do enxoval'}</button>
<p class="note">Saldo de cada área = orçamento da área − comprometido (valor contratado; enquanto o item não é contratado, vale o previsto). O que já foi pago não é somado de novo. Obra e enxoval são sempre mostrados separados.</p>
${pendBox()}`}
function dangerZone(){const n=act().length,p=S.pays.length;
 return `<section class="danger" id="dz" aria-labelledby="dzh"><h2 id="dzh">Ações destrutivas</h2><p class="note">Estas ações removem dados. Baixe ou copie um backup antes, na seção acima.</p>
${U.wipe?`<form class="wipe" data-wipef role="alertdialog" aria-labelledby="wt" aria-describedby="wd"><b id="wt">Apagar tudo?</b>
<p id="wd" class="fin" style="margin:6px 0">${C.mode?'Todos os dados da casa serão removidos, <b>para todas as pessoas e em todos os aparelhos</b>':'Todos os dados deste aparelho serão removidos'}: ${n} item(ns), ${p} pagamento(s), ambientes, fornecedores, histórico, anotações, fotos, o nome e a capa da casa. <b>Esta ação não pode ser desfeita.</b></p>
<div class="two" style="margin:8px 0"><button type="button" class="btn alt" data-exp="file">Baixar backup antes</button><button type="button" class="btn alt" data-exp="copy">Copiar texto</button></div>${U.bmsg?`<p class="warn ok" role="status">${esc(U.bmsg)}</p>`:''}
<label>Para confirmar, digite APAGAR<input name="confirm" id="wipein" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="wd" data-wipein></label>
${U.wipeErr?`<p class="warn" role="alert">${esc(U.wipeErr)}</p>`:''}
<div class="two" style="margin-top:10px"><button type="button" class="btn alt" data-wipex>Cancelar</button><button class="btn bad" id="wipego" disabled>Apagar tudo</button></div></form>`
:(C.mode&&C.info&&C.info.role==='member')?`<p class="note">Só quem criou a casa pode apagar tudo.</p>`:`<button class="btn altbad" data-wipe style="width:100%">Apagar tudo…</button>`}</section>`}
const budgetEdit=a=>{const o=a==='obra';return `<details class="bud" id="orc" ${U.orc?'open':''}><summary>Orçamento ${o?'da obra':'do enxoval'} (editar)</summary><div class="grid">${bin(a,o?'Orçamento da obra':'Orçamento do enxoval')}</div><p class="note">Valor opcional, só para ${o?'a obra/reforma':'o enxoval'}. Saldo = orçamento − comprometido. ${o?'O orçamento do enxoval fica na aba Enxoval.':'O orçamento da obra fica na aba Obra.'} Os dois nunca são somados.</p></details>`};
function aboutCard(){const u=U.upd,nv=typeof u==='string'&&u.startsWith('new:');
 return `<section class="card about" aria-labelledby="abh"><h3 id="abh" style="margin-top:0">Sobre o app</h3><p class="fin" style="margin:0 0 8px">Versão de <b>${verTxt(APP_VER)}</b></p>`+(canUpd()?(
  u==='checking'?'<p class="note" role="status">Procurando atualização…</p>'
  :nv?`<p class="warn ok" role="status">Há uma versão nova (${verTxt(u.slice(4))}). Seus dados não são apagados.</p><button class="btn" data-updgo style="width:100%">Atualizar agora</button>`
  :`${u==='ok'?'<p class="warn ok" role="status">Você já está na versão mais recente.</p>':u==='err'?'<p class="warn" role="alert">Não foi possível verificar. Confira a internet e tente de novo.</p>':''}<button class="btn alt" data-updchk style="width:100%">Procurar atualização</button>`
 ):'<p class="note">A atualização automática funciona no app instalado a partir do endereço da internet.</p>')+'</section>'}
async function updCheck(){U.upd='checking';render();try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});const m=/APP_VER=.(\d{8}-\d{4}).;/.exec(await r.text());U.upd=!r.ok||!m?'err':m[1]===APP_VER?'ok':'new:'+m[1]}catch(e){U.upd='err'}render()}
async function updGo(){try{const rs=await navigator.serviceWorker.getRegistrations();for(const g of rs)await g.unregister();for(const k of await caches.keys())if(k.startsWith('hth'))await caches.delete(k)}catch(e){}location.reload()}
function dedupCard(){const gs=dupGroups();if(!gs.length)return '';const safe=gs.reduce((a,g)=>a+g.safe.length,0),rev=gs.filter(g=>g.review.length),ok=recentBackup(),arm=U.arm==='dedup';
 return `<section class="dedup" aria-labelledby="dph"><h3 id="dph">Itens repetidos</h3>
<p>${safe?`Encontrei <b>${safe}</b> item(ns) repetido(s) em ${gs.filter(g=>g.safe.length).length} grupo(s): mesmo nome, área, valor e ambiente, e <b>sem pagamentos, fotos ou anotações</b>. Eles vão para “Itens excluídos” e podem ser restaurados.`:'Há itens com o mesmo nome, mas todos têm dados registrados. Revise manualmente.'}</p>
${safe?`<p class="fin">Itens ativos: ${act().length} → ${act().length-safe}</p>
<details class="addbox gonebox" data-addbox="dup" ${U.addOpen.dup?'open':''}><summary>Ver quais serão arquivados</summary>${gs.filter(g=>g.safe.length).slice(0,60).map(g=>`<div class="gr"><div class="gl2"><span class="gn2">${esc(g.keep.name)}</span><small>${AREA_NM[g.keep.area]||''} · ${R(g.keep.planned)} · fica 1, arquiva ${g.safe.length}</small></div></div>`).join('')}${gs.filter(g=>g.safe.length).length>60?'<p class="note">E outros grupos.</p>':''}</details>
${ok?'<p class="warn ok" role="status">Backup feito há pouco. Pode limpar.</p>':'<p class="note">Antes de limpar, baixe um backup (vale por 30 minutos).</p><button class="btn alt" data-exp="file" style="width:100%">Baixar backup antes</button>'}
<button class="btn" data-dedup ${ok?'':'disabled'} style="width:100%;margin-top:8px">${arm?'Toque de novo para arquivar '+safe:'Arquivar '+safe+' repetido(s)'}</button>`:''}
${rev.length?`<p class="note">Com dados nos dois lados (não mexi): ${rev.slice(0,12).map(g=>esc(g.keep.name)+' ×'+(1+g.review.length+g.safe.length)).join(', ')}${rev.length>12?'…':''}.</p>`:''}</section>`}
const backupPage=()=>crumb()+`<h2 class="pt" id="bkp">Backup</h2>`+accountCard()+localAccountHint()+`<p class="note">${C.mode?'Seus dados estão na conta. Você também pode baixar ou copiar um backup para guardar uma cópia à parte, e restaurar aqui.':'Seus dados e fotos ficam só neste aparelho. Baixe ou copie um backup para guardar ou levar para outro aparelho, e restaure aqui.'}</p>`+backupCard()+dedupCard()+archive()+aboutCard()+dangerZone()

/* ---------- Escolha de cômodos: tipos, textos e ilustrações próprias ---------- */
const RT_ORDER=['sala','jantar','cozinha','casal','solteiro','crianca','escritorio','banheiro','lavabo','lavanderia','varanda','closet','corredor','despensa','garagem','quintal'];

   const ops=[...d.up.map(u=>({t:'s',u})),...d.del.map(x=>({t:'d',x}))];

    const {error}=await C.sb.from('records').upsert(part.map(o=>o.t==='s'?rowOf(o.u):tombOf(o.x)),{onConflict:'household_id,coll,id'});if(error)throw error;

 const {data,error}=await C.sb.from('photos').select('id').eq('household_id',C.hid);if(error)throw error;const have=new Set(data.map(x=>x.id));

 try{C.view='work';C.work=mode==='merge'?'Juntando os dados deste aparelho com os da conta…':'Enviando seus dados para a conta…';render();
  const leg=migrate(JSON.parse(JSON.stringify(C.LEG)));
  if(mode==='merge'){S=EMPTY();C.sy=newSync();startSync();await new Promise((res,rej)=>{const t0=Date.now(),w=()=>C.ready?res():C.listenErr?rej(new Error(C.listenErr)):Date.now()-t0>25000?rej(new Error('Tempo esgotado ao ler a conta.')):setTimeout(w,100);w()});mergeData(S,leg)}
  else{S=leg;C.sy=newSync()}
  SAVEKEY=cacheKey(C.hid);ONSAVE=null;C.ready=true;localSave();
  C.view='app';await cloudPush();C.view='work';
  if(C.pushErr)throw new Error(C.pushErr);
  const bad=await verifyCloud();if(bad.length)throw new Error('A conferência encontrou diferenças: '+bad.join('; ')+'. Nada foi apagado deste aparelho.');

  U.msg=`Pronto: ${S.items.length} item(ns), ${S.pays.length} pagamento(s) e ${S.rooms.length} ambiente(s) estão na sua conta. A cópia deste aparelho foi mantida.`;
  if(mode!=='merge')startSync();enterApp()}
 catch(e){C.view=C.cloudHas?'choose':'migrate';C.err=(e&&e.message&&!e.code&&!isNet(e))?e.message:sbErr(e);S=EMPTY();SAVEKEY=null;ONSAVE=null;stopSync();C.ready=false;C.dirty=false;C.pushing=false;try{localStorage.removeItem(cacheKey(C.hid));localStorage.removeItem(syKey(C.hid))}catch(x){}C.sy=newSync();render()}}

  C.ready=true;startSync();enterApp()}
 catch(e){C.view='app';C.pushErr=sbErr(e);U.wipeErr='Não foi possível apagar agora: '+rpcErr(e);render()}}

async function inviteSend(email){if(C.invBusy)return;C.invBusy=true;C.invErr='';C.invMsg='';render();
 try{const r=await rpc('invite_member',{p_email:email});C.invMsg='Convite criado para '+r.email+'. Peça para essa pessoa abrir o app e entrar com o Google usando exatamente esse e-mail.';C.invBusy=false;await cloudInfo()}
 catch(e){C.invErr=rpcErr(e);C.invBusy=false;render()}}
async function houseDo(fn,args){C.invErr='';C.invMsg='';C.confirmRm=null;
 try{await rpc(fn,args);await cloudInfo()}catch(e){C.invErr=rpcErr(e);render()}}
async function leaveHouse(){C.confirmLeave=false;
 try{clearTimeout(C.timer);if(C.dirty&&navigator.onLine&&C.ready)await cloudPush();await rpc('leave_household');lostHouse(false)}catch(e){C.invErr=rpcErr(e);render()}}
function cloudAct(a){
 if(a==='login')signIn();
 else if(a==='local'){lss(LOCALFLAG,'1');location.reload()}
 else if(a==='account'){try{localStorage.removeItem(LOCALFLAG)}catch(e){}location.reload()}
 else if(a==='retry'){C.err='';if(!C.sb){location.reload();return}if(C.user){C.view='boot';onUser(C.user)}else{C.view='login';render()}}
 else if(a==='signout'){C.confirmOut=true;render()}else if(a==='signout-x'){C.confirmOut=false;render()}else if(a==='signout-go')signOut();
 else if(a==='mig-send')doMigrate('send');else if(a==='ch-merge')doMigrate('merge');
 else if(a==='mig-bk')exportLeg();
 else if(a.startsWith('inv-x:'))houseDo('cancel_invite',{p_id:a.slice(6)});
 else if(a.startsWith('rm:')){C.confirmRm=a.slice(3);render()}else if(a==='rm-no'){C.confirmRm=null;render()}else if(a.startsWith('rm-go:'))houseDo('remove_member',{p_user:a.slice(6)});
 else if(a==='leave'){C.confirmLeave=true;render()}else if(a==='leave-no'){C.confirmLeave=false;render()}else if(a==='leave-go')leaveHouse();
 else if(a==='mig-skip'||a==='ch-cloud')cloudSkipLegacy();
 else if(a==='mig-review'){C.err='';stopSync();clearTimeout(C.timer);C.cloudHas=hasUserData(S);C.view=C.cloudHas?'choose':'migrate';S=EMPTY();SAVEKEY=null;ONSAVE=null;C.ready=false;C.sy=newSync();render()}}

/* --- telas --- */
const legCount=()=>{const n=countData(C.LEG||EMPTY());return `${n.items} item(ns), ${n.pays} pagamento(s), ${n.rooms} ambiente(s), ${n.sup} fornecedor(es) e ${n.notes} anotação(ões)`};
const clErr=()=>C.err?`<p class="warn" role="alert">${esc(C.err)}</p>${C.diag?`<p class="note" style="font-size:12px;word-break:break-word">${esc(C.diag)}</p>`:''}`:'';
function cloudScreen(){const v=C.view,msg=U.bmsg||U.msg;
 const wrap=h=>`<section class="ob-s cl"><p class="appn">House to Home</p>${h}</section>`;
 if(v==='boot'||v==='gate'||v==='load'||v==='work')return wrap(`<h1>${v==='work'?esc(C.work):v==='gate'?'Verificando sua conta…':v==='load'?'Carregando seus dados…':'Abrindo…'}</h1><p class="note" role="status">Aguarde um instante. Não feche o app.</p><div class="spin" aria-hidden="true"></div>`);
 if(v==='login')return wrap(`<h1>Sua casa, na sua conta</h1><p class="lead">Entre com o Google para guardar seus dados com segurança e usar o app em outros aparelhos.</p>${clErr()}
<button class="btn gbtn" data-cl="login" ${C.busy?'disabled':''}>${C.busy?'Abrindo o Google…':'Entrar com o Google'}</button>
<p class="note">O app nunca vê sua senha: o login é feito pelo Google. Só você e as pessoas que você convidar veem os dados da casa.</p>
<button class="lk" data-cl="local">Usar só neste aparelho (sem conta)</button>`);
 if(v==='error')return wrap(`<h1>Não foi possível continuar</h1>${clErr()}<div class="two"><button class="btn" data-cl="retry">Tentar de novo</button>${C.uid?'<button class="btn alt" data-cl="signout-go">Sair da conta</button>':''}</div>${C.uid?'':'<button class="lk" data-cl="local">Usar só neste aparelho (sem conta)</button>'}`);
 if(v==='migrate'||v==='choose'){const m=v==='migrate';
  return wrap(`<h1>${m?'Enviar os dados deste aparelho?':(C.joined?'Esta casa já tem dados':'Esta conta já tem dados')}</h1>
<p class="lead">${m?'Encontramos dados salvos só neste aparelho:':'Esta conta já tem dados salvos, e este aparelho também tem dados próprios:'} <b>${esc(legCount())}</b>.</p>
<p class="note"><b>Nada será apagado deste aparelho.</b> A cópia local continua aqui, intacta, mesmo depois do envio. ${m?'Ao enviar, o app confere se tudo chegou antes de dizer “pronto”.':'Você escolhe como juntar.'}</p>
${C.legHint?`<p class="warn">${esc(C.legHint)}</p>`:''}${clErr()}${msg?`<p class="warn ok" role="status">${esc(msg)}</p>`:''}
<button class="btn alt" data-cl="mig-bk" style="width:100%;margin:8px 0">Baixar um backup deste aparelho antes</button>
${m?`<button class="btn" data-cl="mig-send" style="width:100%;margin:8px 0">Enviar para minha conta</button><button class="btn alt" data-cl="mig-skip" style="width:100%;margin:8px 0">Não enviar; começar a conta vazia</button>`
:`<button class="btn" data-cl="ch-merge" style="width:100%;margin:8px 0">Mesclar os dois (recomendado)</button><p class="note" style="margin-top:0">Junta tudo sem apagar nada: o que já existe na conta é mantido e só o que falta vem deste aparelho.</p><button class="btn alt" data-cl="mig-skip" style="width:100%;margin:8px 0">Usar só os dados da conta</button>`}
<button class="lk" data-cl="signout-go">Sair da conta</button>${lsg(cacheKey(C.hid))?'<button class="lk" data-cl="retry">Decidir depois</button>':''}`)}
 return ''}
function houseCard(){const i=C.info;if(!i||!i.household_id)return '';const own=i.role==='owner',me=C.uid,ms=i.members||[];
 const mem=ms.map(m=>`<li><span>${esc(m.email||'(sem e-mail)')}${m.user_id===me?' <i>(você)</i>':''} · ${m.role==='owner'?'criou a casa':'participante'}</span>${own&&m.user_id!==me?(C.confirmRm===m.user_id?`<span class="two"><button class="btn alt" data-cl="rm-no">Cancelar</button><button class="btn bad" data-cl="rm-go:${esc(m.user_id)}">Remover</button></span>`:`<button class="lk" data-cl="rm:${esc(m.user_id)}">Remover</button>`):''}</li>`).join('');
 const inv=(i.invites||[]).map(v=>`<li><span>${esc(v.email)} · convite pendente</span>${own?`<button class="lk" data-cl="inv-x:${esc(v.id)}">Cancelar convite</button>`:''}</li>`).join('');
 const other=i.pending_elsewhere?`<p class="warn" role="alert">Você tem um convite para outra casa, mas esta casa já tem dados e não é trocada sozinha. ${ms.length>1?'Para aceitar, primeiro remova as outras pessoas desta casa.':'Para aceitar: 1) baixe um backup aqui em cima; 2) apague tudo (no fim desta página); 3) saia e entre de novo com o Google. Depois você pode restaurar o backup na casa nova.'}</p>`:'';
 return `<h3 style="margin:14px 0 4px">Casa compartilhada</h3><p class="note" style="margin:0 0 6px">Quem está na casa vê e edita as mesmas informações, em tempo real.</p>
<ul class="mem">${mem}${inv}</ul>${other}
${own?`<form data-invf><label>Convidar por e-mail<input type="email" name="email" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="email@gmail.com" required></label><button class="btn" style="width:100%;margin:8px 0" ${C.invBusy?'disabled':''}>${C.invBusy?'Convidando…':'Convidar'}</button></form>`
 :(C.confirmLeave?`<div class="two"><button class="btn alt" data-cl="leave-no">Cancelar</button><button class="btn bad" data-cl="leave-go">Sim, sair da casa</button></div><p class="note">Você deixa de ver estes dados e passa a ter uma casa só sua, vazia. Os dados continuam com quem criou a casa.</p>`:`<button class="btn alt" data-cl="leave" style="width:100%;margin:8px 0">Sair desta casa</button>`)}
${C.invErr?`<p class="warn" role="alert">${esc(C.invErr)}</p>`:''}${C.invMsg?`<p class="warn ok" role="status">${esc(C.invMsg)}</p>`:''}`}
function accountCard(){if(!C.mode||!C.uid)return '';
 const legLeft=C.LEG&&hasUserData(C.LEG)&&lsg(migKey(C.uid))!=='1';
 return `<section class="card acct" aria-labelledby="acth"><h2 id="acth">Conta</h2><p class="fin" style="margin:4px 0">Conectado como <b>${esc((C.user&&C.user.email)||'')}</b></p>
<p class="note" id="acs" role="status">${esc(document.getElementById('sync')?document.getElementById('sync').textContent:'')}</p>
<p class="note">Seus dados e fotos ficam salvos na casa e aparecem em qualquer aparelho em que você entrar. Restaurar um backup aqui também atualiza a casa para todos.</p>
${houseCard()}
${legLeft?`<p class="warn">Há dados antigos neste aparelho que ainda não foram enviados à conta.</p><button class="btn alt" data-cl="mig-review" style="width:100%;margin:6px 0">Revisar e enviar</button>`:''}
${C.confirmOut?`<div class="two"><button class="btn alt" data-cl="signout-x">Cancelar</button><button class="btn" data-cl="signout-go">Sim, sair</button></div><p class="note">${C.dirty||!navigator.onLine?'Há alterações ainda não enviadas. Elas ficam guardadas neste aparelho e serão enviadas quando você entrar de novo com esta conta.':'Seus dados continuam na conta. Para voltar, entre de novo com o Google.'}</p>`:`<button class="btn alt" data-cl="signout" style="width:100%">Sair da conta</button>`}</section>`}
const localAccountHint=()=>(!C.mode&&SBF())?`<section class="card"><h2>Conta</h2><p class="note">Você está usando o app só neste aparelho.</p><button class="btn alt" data-cl="account" style="width:100%">Entrar com o Google</button></section>`:'';

/* App instalável: service worker (só em https ou localhost; no artefato não faz nada) */
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')&&document.querySelector('link[rel=manifest]'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}catch(e){}
/* ---------- Início ---------- */
const onHost=/\.github\.io$/.test(location.hostname);
if((SBF()||onHost)&&lsg(LOCALFLAG)!=='1'){
 const st0=load(localStorage);C.LEG=hasUserData(S)?JSON.parse(JSON.stringify(S)):null;S=EMPTY();SAVEKEY=null;
 if(!SBF()){C.mode=true;C.view='error';C.err='O app ainda não está ligado ao Supabase (arquivo config.js sem preencher) ou a biblioteca não carregou. Verifique a conexão e tente de novo.';render()}
 else{render();cloudInit()}
}else{
const st=load(localStorage);save();render();mig();
if(st==='corrupt'){U.msg='Os dados salvos estavam ilegíveis. Uma cópia foi guardada e o app começou vazio. Se você tem um backup, restaure-o.';render()}
}
</script>
